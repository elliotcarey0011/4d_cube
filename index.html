<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>4D Cube — spacetime video cube</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="hud">
        <div id="topbar">
          <label class="btn" for="fileInput">Import video</label>
          <input id="fileInput" type="file" accept="video/*" hidden />
          <span id="fileName" class="filename"></span>
          <div class="spacer"></div>
          <button id="playPauseBtn" class="btn" disabled>Play</button>
        </div>

        <div id="loading" class="hidden">
          <div class="loadingBox">
            <div id="loadingLabel">Extracting frames…</div>
            <div class="progressTrack"><div id="progressFill" class="progressFill"></div></div>
          </div>
        </div>

        <div id="controls" class="hidden">
          <div class="row">
            <span class="label">Time</span>
            <input id="scrubSlider" type="range" min="0" max="1" step="0.001" value="0" />
            <span id="scrubReadout" class="readout">0 / 0</span>
          </div>
          <div class="row">
            <span class="label">Trail opacity</span>
            <input id="opacitySlider" type="range" min="0" max="1" step="0.01" value="0.18" />
          </div>
        </div>

        <div id="hint" class="hint">
          Drag = orbit &nbsp;·&nbsp; Scroll / pinch = zoom in &amp; through the cube &nbsp;·&nbsp; Shift+Scroll = scrub frames
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
